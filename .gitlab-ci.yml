stages:
  - validate

default:
  image: node:24-bookworm
  interruptible: true
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/

validate:
  stage: validate
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run lint
    - npx expo export --platform web --output-dir dist
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
